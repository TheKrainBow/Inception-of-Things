apiVersion: apps/v1
kind: Deployment
metadata:
  name: playground
  namespace: dev-gitlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playground
  template:
    metadata:
      labels:
        app: playground
    spec:
      containers:
        - name: playground
          image: wil42/playground:v2
          ports:
            - containerPort: 8888
---
apiVersion: v1
kind: Service
metadata:
  name: playground
  namespace: dev-gitlab
spec:
  # ClusterIP, not LoadBalancer: p3's own "playground" Service already
  # claims hostPort 8888 on this single-node cluster, so a second
  # LoadBalancer Service on the same port would just sit pending forever.
  # Reach this one with: kubectl -n dev-gitlab port-forward svc/playground 8890:8888
  type: ClusterIP
  selector:
    app: playground
  ports:
    - port: 8888
      targetPort: 8888
