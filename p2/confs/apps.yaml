apiVersion: v1
kind: ConfigMap
metadata:
  name: app1-content
  labels:
    app.kubernetes.io/name: app1
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>IoT - Application 1</title>
      <style>
        body { margin: 0; display: grid; min-height: 100vh; place-items: center; background: #071a2b; color: #e7f5ff; font: 18px system-ui, sans-serif; }
        main { max-width: 42rem; padding: 3rem; text-align: center; }
        strong { color: #38bdf8; font-size: 4rem; }
        code { color: #bae6fd; }
      </style>
    </head>
    <body>
      <main id="app-1">
        <strong>APP 1</strong>
        <p>Selected by the HTTP host <code>app1.com</code>.</p>
      </main>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  labels:
    app.kubernetes.io/name: app1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app1
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: app1-content
---
apiVersion: v1
kind: Service
metadata:
  name: app1
  labels:
    app.kubernetes.io/name: app1
spec:
  selector:
    app.kubernetes.io/name: app1
  ports:
    - name: http
      port: 80
      targetPort: http
---
